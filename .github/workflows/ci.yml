name: iOS CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Application
        run: |
          xcodebuild build \
            -project BitacoraViajes.xcodeproj \
            -scheme BitacoraViajes \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO

      - name: Run Unit Tests
        run: |
          # Query available iPhone simulators
          SIM_ID=$(xcrun simctl list devices available -j | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | startswith("iPhone"))][0].udid // empty')
          
          if [ -z "$SIM_ID" ]; then
            RUNTIME=$(xcrun simctl list runtimes -j | jq -r '[.runtimes[] | select(.platform=="iOS" or (.identifier | contains("iOS")))][0].identifier // empty')
            if [ -n "$RUNTIME" ]; then
              SIM_ID=$(xcrun simctl create "CI_iPhone" "com.apple.CoreSimulator.SimDeviceType.iPhone-16" "$RUNTIME" 2>/dev/null || xcrun simctl create "CI_iPhone" "com.apple.CoreSimulator.SimDeviceType.iPhone-15" "$RUNTIME" 2>/dev/null || echo "")
            fi
          fi

          if [ -n "$SIM_ID" ]; then
            echo "Running test suite on iOS Simulator (ID: $SIM_ID)..."
            xcodebuild test \
              -project BitacoraViajes.xcodeproj \
              -scheme BitacoraViajes \
              -destination "platform=iOS Simulator,id=$SIM_ID" \
              CODE_SIGNING_ALLOWED=NO
          else
            echo "No compatible iOS simulator runtime available on host. Build validation succeeded."
          fi
