name: BitacoraViajes
options:
  bundleIdPrefix: com.bitacoraviajes
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_PREVIEWS: YES

targets:
  BitacoraViajes:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BitacoraViajes
        excludes:
          - "Resources/Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bitacoraviajes.app
        PRODUCT_NAME: BitacoraViajes
        INFOPLIST_FILE: BitacoraViajes/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: NO
